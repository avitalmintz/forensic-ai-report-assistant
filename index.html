<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fifth Avenue Forensics — Report Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login -->
  <div id="loginSection" class="card auth">
    <div class="brand"><img src="https://fifthavenueforensics.com/wp-content/uploads/2023/10/Fifth-Avenue-Forensics-Logo_Trans_Color.png" alt="Fifth Avenue Forensics"><p>Report Assistant</p></div>
    <div class="field"><label for="email">Email</label><input type="email" id="email" placeholder="your.email@example.com"></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" placeholder="Password"></div>
    <button class="primary" onclick="login()" id="loginBtn">Sign In</button>
    <div id="loginError" class="error"></div>
  </div>

  <!-- New password -->
  <div id="passwordChangeSection" class="card auth" style="display:none">
    <div class="brand"><h1>Set New Password</h1><p>Your temporary password has expired</p></div>
    <div class="field"><label for="newPassword">New Password</label><input type="password" id="newPassword"></div>
    <div class="field"><label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword"></div>
    <button class="primary" onclick="completeNewPassword()" id="changePasswordBtn">Set Password</button>
    <div id="passwordError" class="error"></div>
    <div class="backlink"><a href="#" onclick="backToLogin()">Back to Login</a></div>
  </div>

  <!-- App -->
  <div id="appSection" class="app" style="display:none">
    <header class="topbar">
      <img class="logo" src="https://fifthavenueforensics.com/wp-content/uploads/2023/10/Fifth-Avenue-Forensics-Logo_Trans_Color.png" alt="Fifth Avenue Forensics">
      <div class="modes">
        <button class="mode active" data-mode="evaluation" onclick="setMode('evaluation')">Evaluation Report</button>
        <button class="mode" data-mode="mhc" onclick="setMode('mhc')">Mental Health Court</button>
      </div>
      <div class="who"><span id="userEmail"></span><button class="ghost" onclick="logout()">Logout</button></div>
    </header>

    <div class="workspace">
      <!-- Input column -->
      <section class="inputs">
        <!-- Evaluation Report mode -->
        <div id="panel-evaluation" class="panel">
          <div class="field"><label>Evaluation notes</label>
            <textarea id="interviewNotes" rows="22" placeholder="Paste the clinician's evaluation notes here. The full report is written from these — include everything relevant: case details, history, mental status, and anything you want reflected in the report."></textarea></div>
        </div>

        <!-- Mental Health Court mode -->
        <div id="panel-mhc" class="panel" style="display:none">
          <div class="field"><label>Disorder category</label>
            <select id="disorder">
              <option value="schizophrenia">Schizophrenia</option>
              <option value="ptsd">PTSD / Trauma-Related</option>
              <option value="bipolar">Bipolar / Mood Disorders</option>
            </select>
          </div>
          <div class="field"><label>Standardized evaluation notes</label>
            <textarea id="mhcNotes" rows="22" placeholder="Paste the standardized evaluation notes here. The report is written from these — include everything you want reflected."></textarea></div>
        </div>

        <div class="actions">
          <button class="primary" id="generateBtn" onclick="generate()">Generate Report</button>
          <button class="ghost" onclick="resetInputs()">Clear</button>
        </div>
      </section>

      <!-- Output column -->
      <section class="output">
        <div class="output-head">
          <span>Report</span>
          <div class="out-actions">
            <button class="ghost" id="copyBtn" onclick="copyReport()" disabled>Copy</button>
            <button class="ghost" id="docxBtn" onclick="downloadDocx()" disabled>Download .doc</button>
          </div>
        </div>
        <div class="loading" id="loading"><span></span><span></span><span></span></div>
        <div id="report" class="report placeholder">Fill in the inputs and click Generate. The report will appear here.</div>
        <div id="clarifyPanel" class="clarify-panel" style="display:none"></div>
        <div class="revise" id="reviseBar" style="display:none">
          <input id="reviseInput" placeholder="Ask for changes, e.g. shorten the personal history, strengthen the formulation" onkeydown="reviseKeydown(event)">
          <button class="primary" id="reviseBtn" onclick="revise()">Revise</button>
        </div>
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
